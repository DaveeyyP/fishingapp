name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Közös fájlok másolása
        run: sh sync-shared.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: APK építése
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Weboldal összeállítása (néző oldal + APK letöltés)
        run: |
          mkdir -p site
          cp -r viewer/. site/
          cp android/app/build/outputs/apk/release/app-release.apk site/HorgaszBiro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HorgaszBiro-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
